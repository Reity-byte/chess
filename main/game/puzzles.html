<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzzles · Chess</title>
    <link rel="stylesheet" href="../theme.css?v=22">
    <link rel="stylesheet" href="../pieces.css?v=22">
    <script src="../style-settings.js?v=22"></script>
    <link rel="manifest" href="../manifest.webmanifest">
    <meta name="theme-color" content="#111317">
    <link rel="icon" type="image/png" href="../icons/icon-192.png">
    <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
    <script src="../app.js?v=22" defer></script>
    <link rel="stylesheet" href="game.css?v=22">
    <script src="engine.js?v=22" defer></script>
    <script src="notation.js?v=22" defer></script>
    <script src="board-ui.js?v=22" defer></script>
    <script src="puzzle-bank.js?v=22" defer></script>
    <script src="puzzles-page.js?v=22" defer></script>
</head>
<body>

    <header class="topbar">
        <a class="brand" href="../site.html">
            <span class="brand-mark"><span class="piece-icon white knight"></span></span>
            <span class="brand-name">Chess</span>
        </a>
        <nav class="topnav">
            <a href="game.html">Play</a>
            <a href="analysis.html">Review</a>
            <a href="puzzles.html" class="active">Puzzles</a>
            <a href="history.html">History</a>
            <a href="trainer.html">Train</a>
        </nav>
        <div class="topbar-right">
        </div>
    </header>

    <main class="play-page">
        <section class="board-area">
            <div id="chessboard"></div>
        </section>

        <aside class="side">
            <div class="panel">
                <div class="stat-row">
                    <div class="stat"><span class="eyebrow">Rating</span><strong id="puzzleRatingValue">1200</strong><span class="stat-delta" id="ratingDelta"></span></div>
                    <div class="stat"><span class="eyebrow">Streak</span><strong id="puzzleStreakValue">0</strong><span class="stat-delta"></span></div>
                    <div class="stat"><span class="eyebrow">Solved</span><strong id="puzzleSolvedValue">0</strong><span class="stat-delta"></span></div>
                </div>
            </div>

            <div class="panel">
                <div class="puzzle-prompt">
                    <span class="turn-swatch white" id="turnSwatch"></span>
                    <div>
                        <div class="status-text" id="puzzleCaption">Loading puzzles…</div>
                        <div class="status-sub" id="puzzleSub"></div>
                    </div>
                    <span class="chip" id="puzzleRatingChip" style="margin-left:auto" hidden></span>
                </div>
                <div class="puzzle-result" id="puzzleResult"></div>
                <div class="panel-footer">
                    <button id="hintButton" class="btn">💡 Hint</button>
                    <button id="giveUpButton" class="btn">Show solution</button>
                    <button id="nextPuzzleButton" class="btn btn-primary hidden" style="margin-left:auto">Next puzzle →</button>
                </div>
            </div>

            <div class="panel">
                <div class="panel-body muted" style="font-size:13px">
                    Every position comes from a real game: the side to move can punish the
                    previous move. Puzzles from your own reviewed games are added automatically.
                </div>
            </div>
        </aside>
    </main>

</body>
</html>
