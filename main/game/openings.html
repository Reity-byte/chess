<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Openings · Chess</title>
    <link rel="stylesheet" href="../theme.css?v=32">
    <link rel="stylesheet" href="../pieces.css?v=32">
    <script src="../style-settings.js?v=32"></script>
    <link rel="manifest" href="../manifest.webmanifest">
    <meta name="theme-color" content="#111317">
    <link rel="icon" type="image/png" href="../icons/icon-192.png">
    <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
    <script src="../app.js?v=32" defer></script>
    <link rel="stylesheet" href="game.css?v=32">
    <script src="engine.js?v=32" defer></script>
    <script src="notation.js?v=32" defer></script>
    <script src="sound.js?v=32" defer></script>
    <script src="board-ui.js?v=32" defer></script>
    <script src="opening-repertoires.js?v=32" defer></script>
    <script src="openings-page.js?v=32" defer></script>
</head>
<body>

    <header class="topbar">
        <a class="brand" href="../site.html">
            <span class="brand-mark"><span class="piece-icon white knight"></span></span>
            <span class="brand-name">Chess</span>
        </a>
        <nav class="topnav">
            <a href="game.html">Play</a>
            <a href="analysis.html">Review</a>
            <a href="puzzles.html">Puzzles</a>
            <a href="history.html">History</a>
            <a href="trainer.html" class="active">Train</a>
        </nav>
        <div class="topbar-right">
        </div>
    </header>

    <main class="trainer-page openings-page">
        <!-- ── HERO ───────────────────────────────────────────────────────── -->
        <section class="panel train-hero" id="openingsHero">
            <div class="train-hero-main">
                <a class="back-link" href="trainer.html">← Train</a>
                <div class="eyebrow">Opening trainer</div>
                <h1>Learn your openings by heart</h1>
                <p class="muted" id="heroSub">Pick a repertoire, learn one line at a time, and review it on the days it's due.</p>
                <button class="btn btn-primary btn-lg" id="reviewAll">▶ Review due lines</button>
            </div>
            <div class="train-stats">
                <div class="train-stat"><strong id="statLearned">0</strong><span>Lines learned</span></div>
                <div class="train-stat"><strong id="statDue">0</strong><span>Due today</span></div>
                <div class="train-stat"><strong id="statMastered">0</strong><span>Mastered</span></div>
                <div class="train-stat"><strong id="statTotal">0</strong><span>Lines in all</span></div>
            </div>
        </section>

        <!-- ── DRILL (inline board) ───────────────────────────────────────── -->
        <section class="panel train-session hidden" id="drill">
            <div class="session-head">
                <div>
                    <div class="eyebrow" id="drillTitle">Learning</div>
                    <div class="session-count" id="drillCount">1 / 1</div>
                </div>
                <div class="session-streak" id="drillMode"></div>
                <button class="btn btn-ghost btn-icon" id="endDrill" title="End session" aria-label="End session">✕</button>
            </div>
            <div class="session-progress"><div class="session-progress-fill" id="drillFill"></div></div>
            <div class="session-body">
                <div class="session-board-wrap">
                    <div id="openingBoard"></div>
                </div>
                <div class="session-side">
                    <div class="session-task" id="drillTask"></div>
                    <div class="line-moves" id="drillMoves"></div>
                    <div class="session-feedback hidden" id="drillFeedback"></div>
                    <div class="session-actions" id="drillActions"></div>
                </div>
            </div>
        </section>

        <!-- ── REPERTOIRES ────────────────────────────────────────────────── -->
        <section class="trainer-section">
            <h2>Repertoires</h2>
            <div class="repertoire-grid" id="repertoireGrid"></div>
        </section>

        <section class="panel" id="linePanel">
            <div class="panel-header"><span id="linePanelTitle">Lines</span>
                <div class="line-panel-actions" id="linePanelActions"></div>
            </div>
            <div class="practice-list" id="lineList"></div>
        </section>
    </main>

</body>
</html>
