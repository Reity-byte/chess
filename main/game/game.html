<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play · Chess</title>
    <link rel="stylesheet" href="../theme.css?v=7">
    <link rel="stylesheet" href="game.css?v=7">
    <script src="engine.js?v=7" defer></script>
    <script src="ai.js?v=7" defer></script>
    <script src="notation.js?v=7" defer></script>
    <script src="openings.js?v=7" defer></script>
    <script src="sound.js?v=7" defer></script>
    <script src="board-ui.js?v=7" defer></script>
    <script src="game-script.js?v=7" defer></script>
</head>
<body>

    <header class="topbar">
        <a class="brand" href="../site.html">
            <span class="brand-mark"><span class="piece-icon white knight"></span></span>
            <span class="brand-name">Chess</span>
        </a>
        <nav class="topnav">
            <a href="game.html" class="active">Play</a>
            <a href="analysis.html">Review</a>
            <a href="puzzles.html">Puzzles</a>
        </nav>
        <div class="topbar-right">
            <div class="board-theme-picker" aria-label="Board theme"></div>
            <button id="soundToggleButton" class="btn btn-ghost btn-icon" aria-label="Mute sound">🔊</button>
        </div>
    </header>

    <main class="play-page">
        <section class="board-area">
            <div class="player-strip" id="topStrip">
                <div class="avatar"><span class="piece-icon black king" id="topAvatar"></span></div>
                <div class="player-meta">
                    <span class="player-name"><span id="topName">Engine</span><span class="thinking-dots">•••</span></span>
                    <div class="captured" id="topCaptured"></div>
                </div>
                <div class="clock" id="topClock"></div>
            </div>

            <div id="chessboard"></div>

            <div class="player-strip" id="bottomStrip">
                <div class="avatar"><span class="piece-icon white king" id="bottomAvatar"></span></div>
                <div class="player-meta">
                    <span class="player-name"><span id="bottomName">You</span><span class="thinking-dots">•••</span></span>
                    <div class="captured" id="bottomCaptured"></div>
                </div>
                <div class="clock" id="bottomClock"></div>
            </div>
        </section>

        <aside class="side">
            <div class="panel status-card">
                <span class="status-dot" id="statusDot"></span>
                <div>
                    <div class="status-text" id="statusText">Ready to play</div>
                    <div class="status-sub" id="statusSub">Start a new game to begin.</div>
                </div>
                <span class="chip" id="levelChip" style="margin-left:auto" hidden></span>
            </div>

            <div class="panel moves-panel">
                <div class="panel-header">Moves <span class="muted" id="openingName"></span></div>
                <div class="moves-scroll" id="movesScroll">
                    <div class="moves-grid" id="movesGrid"></div>
                    <div class="moves-empty" id="movesEmpty">No moves yet.</div>
                </div>
                <div class="action-grid" id="liveActions">
                    <button class="btn" id="takebackButton" title="Take back your last move">↶ Takeback</button>
                    <button class="btn" id="offerDrawButton">½ Draw</button>
                    <button class="btn btn-danger" id="resignButton">⚑ Resign</button>
                </div>
                <div class="panel-footer">
                    <button class="btn btn-primary" id="newGameButton">New game</button>
                    <button class="btn btn-icon" id="flipButton" title="Flip board" aria-label="Flip board">⇅</button>
                    <button class="btn btn-icon" id="copyPgnButton" title="Copy PGN" aria-label="Copy PGN">⧉</button>
                    <button class="btn btn-icon" id="pgnButton" title="Download PGN" aria-label="Download PGN">⤓</button>
                </div>
            </div>
        </aside>
    </main>

    <!-- ── SETUP ─────────────────────────────────────────────────────────── -->
    <div id="setupModal" class="modal-overlay hidden">
        <div class="modal setup-modal">
            <h2>New game</h2>
            <p class="modal-sub">Choose how you want to play.</p>

            <div class="eyebrow field-label">Mode</div>
            <div class="segmented" data-group="mode">
                <button data-value="human" class="selected">You vs Engine</button>
                <button data-value="ai">Engine vs Engine</button>
            </div>

            <div id="colorChoiceRow">
                <div class="eyebrow field-label">Play as</div>
                <div class="segmented" data-group="color">
                    <button data-value="white" class="selected">White</button>
                    <button data-value="random">Random</button>
                    <button data-value="black">Black</button>
                </div>
            </div>

            <div class="eyebrow field-label">Engine strength</div>
            <div class="segmented" data-group="difficulty">
                <button data-value="beginner">Beginner<small>~depth 1</small></button>
                <button data-value="intermediate" class="selected">Casual<small>~depth 2</small></button>
                <button data-value="expert">Expert<small>~depth 6</small></button>
                <button data-value="master">Master<small>full</small></button>
            </div>

            <div class="eyebrow field-label">Time control</div>
            <div class="segmented" data-group="time">
                <button data-value="5|0">5 | 0</button>
                <button data-value="10|5">10 | 5</button>
                <button data-value="15|10">15 | 10</button>
                <button data-value="unlimited" class="selected">∞</button>
            </div>

            <div class="modal-actions">
                <button id="beginGameButton" class="btn btn-primary btn-lg">Start game</button>
                <button id="cancelSetupButton" class="btn btn-lg">Cancel</button>
            </div>
        </div>
    </div>

    <!-- ── GAME OVER ─────────────────────────────────────────────────────── -->
    <div id="gameOverModal" class="modal-overlay hidden">
        <div class="modal">
            <h2 id="gameOverTitle">Game over</h2>
            <p class="modal-sub" id="gameOverReason"></p>
            <div class="result-banner">
                <span class="result-score" id="gameOverScore">½–½</span>
                <span class="muted" id="gameOverMoves"></span>
            </div>
            <div class="modal-actions">
                <button id="reportButton" class="btn btn-primary btn-lg btn-block">★ Game Review</button>
                <button id="restartButton" class="btn">New game</button>
                <button id="copyPgnButtonModal" class="btn">Copy PGN</button>
                <button id="pgnButtonModal" class="btn">Download PGN</button>
                <button id="closeModalButton" class="btn btn-ghost">Close</button>
            </div>
        </div>
    </div>

    <!-- ── PGN TEXT ──────────────────────────────────────────────────────── -->
    <div id="pgnModal" class="modal-overlay hidden">
        <div class="modal">
            <h2>PGN</h2>
            <p class="modal-sub">Paste it into any chess site or the Review page.</p>
            <textarea id="pgnTextArea" class="pgn-input" rows="10" readonly style="margin-top:16px"></textarea>
            <div class="modal-actions">
                <button id="copyPgnConfirmButton" class="btn btn-primary">Copy to clipboard</button>
                <button id="closePgnModalButton" class="btn">Close</button>
            </div>
        </div>
    </div>

</body>
</html>
